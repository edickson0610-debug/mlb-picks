name: Analizar MLB

on:
  schedule:
    # 11am ET (15:00 UTC) - para juegos 1pm
    - cron: '0 15 * * *'
    # 2pm ET (18:00 UTC) - para juegos 4pm
    - cron: '0 18 * * *'
    # 5pm ET (21:00 UTC) - para juegos 7pm
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests numpy python-dotenv
      - name: Run analysis
        run: |
          python run_dashboard.py
          mkdir -p public
          cp dashboard_live.html public/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: analyze
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
