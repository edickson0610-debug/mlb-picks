name: Analizar MLB y Publicar Dashboard

on:
  schedule:
    # 8am y 12pm ET (12:00 y 16:00 UTC en verano)
    - cron: '0 12 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Fecha (YYYY-MM-DD, opcional)'
        required: false
        default: ''

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy python-dotenv

      - name: Run analysis
        run: |
          python run_dashboard.py
          mkdir -p public
          cp dashboard_live.html public/index.html

      - name: Upload page artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: analyze
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
